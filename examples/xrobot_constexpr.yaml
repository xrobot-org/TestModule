# User/xrobot.yaml example: TestModule arguments taken from project-level
# constexprs. The generator emits them as inline constexpr values in
# namespace TestModuleConstexpr before constructing the instances.
constexpr_namespace: TestModuleConstexpr
constexpr_includes:
  - <cstdint>
  - <system_error>
constexprs:
  TestArg1:
    type: uint32_t
    value: '250'
  TestArg2:
    type: const char*
    value: '"abc"'
  TestArg3:
    type: uint32_t
    value: '123'
  TestArg4:
    type: std::errc
    value: std::errc::permission_denied
  TestArg6:
    type: float
    value: 1.5f
  TestArg7:
    type: bool
    value: 'true'
  TestArg8:
    type: TestStructArg
    value:
      x: '1'
      y: 'true'
      z: '2.5'
  TestArg9:
    type: TestArrayArg
    value:
      values:
        - '1'
        - '2'
        - '3'
  TestTemp3:
    type: int
    value: '3'
  TestTemp4:
    type: bool
    value: 'true'
modules:
  - module: xrobot-org/BlinkLED
    id: blinkled_0
    args:
      - led: led_b
      - blink_cycle: '250'
  - module: xrobot-org/TestModule
    id: testmodule_0
    template_args:
      - std::errc
      - int
      - TestModuleConstexpr::TestTemp3
      - TestModuleConstexpr::TestTemp4
    args:
      - test_arg5: blinkled_0
      - test_arg1: TestModuleConstexpr::TestArg1
      - test_arg2: TestModuleConstexpr::TestArg2
      - test_arg3: TestModuleConstexpr::TestArg3
      - test_arg4: TestModuleConstexpr::TestArg4
      - test_arg6: TestModuleConstexpr::TestArg6
      - test_arg7: TestModuleConstexpr::TestArg7
      - test_arg8: TestModuleConstexpr::TestArg8
      - test_arg9: TestModuleConstexpr::TestArg9
settings:
  monitor_sleep_ms: '5'
