name: XRobot Module Build Test

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 1 * *'  # 每月1日凌晨3点（UTC）自动触发

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xrobot-org/docker-image-linux:main
      options: --user 0

    env:
      XR_MODULE_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Checkout current module repo to ./Modules/${{ env.XR_MODULE_NAME }}
        uses: actions/checkout@v4
        with:
          path: Modules/${{ env.XR_MODULE_NAME }}

      - name: Create main.cpp
        run: |
          cat > main.cpp <<'EOF'
          #include <iostream>
          #include "xrobot_main.hpp"
          #include "libxr.hpp"

          int main() {
              LibXR::PlatformInit();
              LibXR::STDIO::Printf("This is XRobot Module Template Test\n");
              LibXR::HardwareContainer hw;
              XRobotMain(hw);
              return 0;
          }
          EOF

      - name: Create minimal CMakeLists.txt
        run: |
          cat > CMakeLists.txt <<'EOF'
          project(xrobot_mod_test CXX)
          set(CMAKE_CXX_STANDARD 17)
          add_executable(xr_test main.cpp)
          set(XROBOT_MODULES_DIR ${CMAKE_CURRENT_SOURCE_DIR}/Modules/)
          add_subdirectory(libxr)
          target_include_directories(xr_test PUBLIC $<TARGET_PROPERTY:xr,INTERFACE_INCLUDE_DIRECTORIES> ${CMAKE_SOURCE_DIR}/User)
          target_link_libraries(xr_test PUBLIC xr)
          EOF

      - name: Pull libxr to ./libxr
        run: git clone --depth=1 https://github.com/Jiu-xiao/libxr ./libxr

      - name: Setup Python & Install deps
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pyyaml requests

      - name: Add XRobot tools to PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install xrobot toolchain (assumes pyproject/tar.gz/pip install .)
        run: |
          pip3 install xrobot libxr

      - name: Pull BlinkLED to ./Modules/BlinkLED
        run: |
          git clone --depth=1 https://github.com/xrobot-org/BlinkLED.git ./Modules/BlinkLED

      - name: Add BlinkLED module
        run: |
          xrobot_add_mod BlinkLED --instance-id BlinkLED_0

      - name: Add this repo module
        run: |
          xrobot_add_mod ${{ env.XR_MODULE_NAME }} && cat User/xrobot.yaml

      - name: Validate manifest-driven config coverage
        run: |
          python3 - <<'PY'
          import pathlib
          import yaml

          data = yaml.safe_load(pathlib.Path("User/xrobot.yaml").read_text(encoding="utf-8"))
          modules = {item["name"]: item for item in data["modules"]}
          blink = modules["BlinkLED"]
          test = modules["TestModule"]

          assert blink["id"] == "BlinkLED_0"
          assert blink["constructor_args"] == {"blink_cycle": 250}

          assert test["id"] == "TestModule_0"
          assert test["constructor_args"] == {
              "test_uint": 250,
              "test_float": 1.5,
              "test_bool": True,
              "test_numeric_string": "123",
              "test_text": "abc",
              "test_enum": "std::errc::permission_denied",
              "test_led": "@BlinkLED_0",
              "test_struct": {"x": 1, "y": True, "z": 2.5},
              "test_array": [1, 2, 3],
          }
          assert test["template_args"] == {
              "enum_type": "std::errc",
              "value_type": "int",
              "count": 3,
              "flag": True,
          }
          print("manifest-driven config coverage OK")
          PY

      - name: Generate manifest-driven main
        run: |
          xrobot_gen_main --config User/xrobot.yaml --output User/xrobot_main.hpp

      - name: Build manifest-driven config
        run: |
          cmake -S . -B build
          cmake --build build

      - name: Generate constexpr example
        run: |
          xrobot_gen_main \
            --config Modules/${{ env.XR_MODULE_NAME }}/examples/xrobot_constexpr.yaml \
            --output User/xrobot_main.hpp

      - name: Validate constexpr output coverage
        run: |
          test -f User/xrobot_constexpr.hpp
          grep -F 'TestModule<std::errc, int, XRobotProject::TemplateCount, XRobotProject::TemplateFlag>' User/xrobot_main.hpp
          grep -F 'XRobotProject::TestStruct' User/xrobot_main.hpp
          grep -F 'XRobotProject::TestArray' User/xrobot_main.hpp
          grep -F 'inline constexpr TestStructArg TestStruct = {1, true, 2.5};' User/xrobot_constexpr.hpp
          grep -F 'inline constexpr TestArrayArg TestArray = {1, 2, 3};' User/xrobot_constexpr.hpp
          grep -F 'inline constexpr std::errc TestEnum = std::errc::permission_denied;' User/xrobot_constexpr.hpp

      - name: Build constexpr config
        run: |
          rm -rf build
          cmake -S . -B build
          cmake --build build

      - name: Create Tag via GitHub API
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagPrefix = 'auto-'
            const date = new Date();
            const yyyy = date.getUTCFullYear();
            const mm = String(date.getUTCMonth() + 1).padStart(2, '0');
            const dd = String(date.getUTCDate()).padStart(2, '0');
            const HH = String(date.getUTCHours()).padStart(2, '0');
            const MM = String(date.getUTCMinutes()).padStart(2, '0');
            const SS = String(date.getUTCSeconds()).padStart(2, '0');
            const tagName = `${tagPrefix}${yyyy}${mm}${dd}-${HH}${MM}${SS}`;

            // 获取当前 commit sha
            const sha = process.env.GITHUB_SHA;

            // 创建 tag reference
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tagName}`,
              sha: sha
            });
            console.log(`Created tag: ${tagName} on sha: ${sha}`);

